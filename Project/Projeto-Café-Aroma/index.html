<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
    <title>Café Aroma</title>
</head>

<body>

    <nav class="navbar sticky-top">
        <div class="container">
            <a href="#" class="navbar-brand">
                <i class="bi bi-cup-hot-fill"></i> Café Aroma
            </a>
            <button class="btn btn-carrinho">
                <i class="bi bi-bag"></i>
                <span id="contador" class="badge">0</span>
            </button>
        </div>
    </nav>

    <header class="banner">
        <div class="container">
            <span class="tag">Torra artesanal</span>
            <h1>O café perfeito<br>para o seu dia</h1>
            <p>Escolha sua bebida favorita e monte o seu pedido.</p>
            <a href="#cardapio" class="btn btn-cafe">Ver cardápio</a>
        </div>
    </header>

    <main class="container py-5">
        <h2 class="titulo-secao">Nosso cardápio</h2>
        <div id="lista-produtos" class="row g-4">
            <!--Aqui irá vir do JavaScript-->
        </div>
    </main>

    <div class="modal fade" id="modalProduto" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <img id="modal-imagem" src="" alt="">
                <button class="btn-close btn-fechar" data-bs-dismiss="modal"></button>

                <div class="modal-body">
                    <h3 id="modal-nome"></h3>
                    <p id="modal-descricao"></p>

                    <div class="d-flex justify-content-between align-items-center">
                        <span id="modal-preco" class="preco"></span>
                        <div class="quantidade">
                            <button id="btn-menos" class="btn-qtd">-</button>
                            <span id="modal-qtd">1</span>
                            <button id="btn-mais" class="btn-qtd">+</button>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-outline-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                        <button id="btn-adicionar" class="btn btn-cafe flex-grow-1">Adicionar ao carringo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" id="carrinho">
        <div class="offcanvas-header">
            <h5><i class="bi bi-bag"></i>Meu carrinho</h5>
            <button class="btn-close" type="button" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body">
            <ul class="list-unstyled"></ul>
        </div>
    </div>

    <div class="carrinho-rodape">
        <p id="aviso-storage" class="aviso"></p>
        <div class="d-flex justify-content-between mb-3">
            <span>Total</span>
            <strong id="total">R$ 0,00</strong>
        </div>
        <button id="btn-limpar" class="btn btn-outline-secondary w-100 mb-2">Limpar carrinho</button>
        <button id="btn-finalizar" class="btn btn-cafe w-100">Finalizar pedido</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>

</html>
