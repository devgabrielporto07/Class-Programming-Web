<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <title>Cafeteria Aroma</title>
</head>

<body>    
    <nav class="navbar stick-top">
        <div class="container">
            <a href="#" class="navbar-brand" id="#">
                <i class="bi bi-cup-hot-fill"></i> Café Aroma
            </a>
            <button class="btn btn-carrinho" data-bs-toggle="offcanvas"           data-bs-target="#carrinho">
                <i class="bi bi-tag"></i>
                <span id="contador" class="badge">0</span>
            </button>
        </div>
    </nav>




    <header>
        <div>
            <span class="tag">Torra artesanal</span>
            <h1>O café perfeito <br>para o seu dia</h1>
            <p>Escolha sua bebida favorita e monte o seu pedido</p>
            <a href="#cardapio" id="btn btn-cafe">Ver cardapio</a>
        </div>
    </header>

    <main id="cardapio" class="container py-5">
        <h2 class="titulo-secao">Nosso cardápio</h2>
        <div id="lista-produtos" class="row g-4">

            
        </div>

    </main>
    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->

</html>
